<!-- @dsCard group="Colors" viewport="700x110" name="Neutral scale" subtitle="Warm-cool balanced greys for text, borders and surfaces" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; padding: 20px; background: var(--surface-page); }
  .row { display: grid; grid-template-columns: repeat(10, 1fr); gap: 6px; }
  .chip { height: 48px; border-radius: var(--radius-sm); border: 1px solid var(--border-subtle); }
  .name { font-family: var(--font-mono); font-size: 10px; color: var(--text-muted); margin-top: var(--space-2); text-align: center; }
</style>
</head>
<body>
  <div class="row">
    <div><div class="chip" style="background:var(--neutral-000)"></div><div class="name">000</div></div>
    <div><div class="chip" style="background:var(--neutral-050)"></div><div class="name">050</div></div>
    <div><div class="chip" style="background:var(--neutral-100)"></div><div class="name">100</div></div>
    <div><div class="chip" style="background:var(--neutral-200)"></div><div class="name">200</div></div>
    <div><div class="chip" style="background:var(--neutral-300)"></div><div class="name">300</div></div>
    <div><div class="chip" style="background:var(--neutral-400)"></div><div class="name">400</div></div>
    <div><div class="chip" style="background:var(--neutral-500)"></div><div class="name">500</div></div>
    <div><div class="chip" style="background:var(--neutral-600)"></div><div class="name">600</div></div>
    <div><div class="chip" style="background:var(--neutral-700)"></div><div class="name">700</div></div>
    <div><div class="chip" style="background:var(--neutral-900)"></div><div class="name">900</div></div>
  </div>
</body>
</html>
