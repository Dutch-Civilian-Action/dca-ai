<!-- @dsCard group="Spacing" viewport="700x150" name="Radii" subtitle="Restrained corners — geometric and minimal, like the diamond mark" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; padding: 24px; background: var(--surface-page); }
  .row { display: flex; gap: var(--space-5); align-items: flex-end; }
  .item { text-align: center; }
  .box { width: 72px; height: 56px; background: var(--dca-blue-100); border: 2px solid var(--dca-blue); }
  .name { font-family: var(--font-mono); font-size: 11px; color: var(--text-muted); margin-top: var(--space-2); }
</style>
</head>
<body>
  <div class="row">
    <div class="item"><div class="box" style="border-radius:var(--radius-xs)"></div><div class="name">xs · 2</div></div>
    <div class="item"><div class="box" style="border-radius:var(--radius-sm)"></div><div class="name">sm · 4</div></div>
    <div class="item"><div class="box" style="border-radius:var(--radius-md)"></div><div class="name">md · 8</div></div>
    <div class="item"><div class="box" style="border-radius:var(--radius-lg)"></div><div class="name">lg · 12</div></div>
    <div class="item"><div class="box" style="border-radius:var(--radius-xl)"></div><div class="name">xl · 16</div></div>
    <div class="item"><div class="box" style="border-radius:var(--radius-pill)"></div><div class="name">pill</div></div>
  </div>
</body>
</html>
