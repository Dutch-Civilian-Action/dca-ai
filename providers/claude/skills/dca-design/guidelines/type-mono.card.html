<!-- @dsCard group="Type" viewport="700x150" name="Mono — operational data" subtitle="Roboto Mono, tabular numerals for figures, codes & timestamps" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; padding: 24px; background: var(--surface-page); }
  .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: var(--space-5); }
  .fig { font-family: var(--font-mono); font-weight: 700; font-variant-numeric: tabular-nums; font-size: 30px; color: var(--dca-blue); letter-spacing: -0.01em; }
  .lab { font-family: var(--font-condensed); font-weight: 700; font-size: 12px; letter-spacing: var(--tracking-label); text-transform: uppercase; color: var(--text-strong); margin-top: var(--space-2); }
  .meta { font-family: var(--font-mono); font-size: 12px; color: var(--text-muted); margin-top: var(--space-1); }
</style>
</head>
<body>
  <div class="grid">
    <div><div class="fig">1,240</div><div class="lab">Boxes delivered</div><div class="meta">2026-03-18 · UA-KHK</div></div>
    <div><div class="fig">€20,000</div><div class="lab">Appeal goal</div><div class="meta">REF #DCA-0421</div></div>
    <div><div class="fig">7 days</div><div class="lab">Fuel funded</div><div class="meta">14:32 CET</div></div>
  </div>
</body>
</html>
