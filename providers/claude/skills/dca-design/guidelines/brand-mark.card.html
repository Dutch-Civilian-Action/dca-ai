<!-- @dsCard group="Brand" viewport="700x220" name="Mark" subtitle="The diamond heart — three squares forming a heart (yellow, orange, blue)" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; padding: 28px; background: var(--surface-page); display: flex; gap: var(--space-7); justify-content: center; align-items: center; }
  .tile { display: flex; align-items: center; justify-content: center; width: 180px; height: 160px; border-radius: var(--radius-md); }
  .tile img { height: 96px; width: auto; }
  .light { background: var(--neutral-050); border: 1px solid var(--border-subtle); }
  .dark { background: var(--dca-black); }
  .info { background: var(--light-grey-blue); }
</style>
</head>
<body>
  <div class="tile light"><img src="../assets/logos/dca-mark.png" alt="DCA mark on light"></div>
  <div class="tile dark"><img src="../assets/logos/dca-mark.png" alt="DCA mark on dark"></div>
  <div class="tile info"><img src="../assets/logos/dca-mark.png" alt="DCA mark on info surface"></div>
</body>
</html>
