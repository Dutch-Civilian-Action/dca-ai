<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; padding: 24px; background: var(--surface-page); display: flex; flex-wrap: wrap; gap: var(--space-5); align-items: center; }
  .eb { display: inline-flex; align-items: center; gap: var(--space-2); font-family: var(--font-condensed); font-weight: 700; font-size: 13px; letter-spacing: var(--tracking-label); text-transform: uppercase; }
  .tick { width: 18px; height: 3px; border-radius: 1px; display: inline-block; }
</style>
</head>
<body>
  <span class="eb" style="color:var(--dca-blue)"><span class="tick" style="background:var(--dca-blue)"></span>Logistics</span>
  <span class="eb" style="color:var(--dca-orange)"><span class="tick" style="background:var(--dca-orange)"></span>Urgent appeal</span>
  <span class="eb" style="color:var(--dca-yellow-700)"><span class="tick" style="background:var(--dca-yellow-700)"></span>Community</span>
  <span class="eb" style="color:var(--text-muted)">Operational report</span>
</body>
</html>
