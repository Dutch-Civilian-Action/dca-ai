<!-- @dsCard group="Type" viewport="700x190" name="Display & headings" subtitle="Roboto Condensed Black / ExtraBold — strong operational hierarchy" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; padding: 24px; background: var(--surface-page); }
  .stack { display: flex; flex-direction: column; gap: var(--space-3); }
  .line { display: flex; align-items: baseline; gap: var(--space-4); }
  .tag { font-family: var(--font-mono); font-size: 11px; color: var(--text-muted); width: 116px; flex: none; }
  .d { font-family: var(--font-display); font-weight: 900; font-size: 44px; line-height: 1; letter-spacing: -0.01em; color: var(--text-strong); }
  .h1 { font-family: var(--font-display); font-weight: 900; font-size: 34px; line-height: 1.04; color: var(--text-strong); }
  .h2 { font-family: var(--font-display); font-weight: 800; font-size: 26px; color: var(--text-strong); }
  .h3 { font-family: var(--font-display); font-weight: 700; font-size: 20px; color: var(--text-strong); }
</style>
</head>
<body>
  <div class="stack">
    <div class="line"><span class="tag">Display · 900</span><span class="d">Aid in motion</span></div>
    <div class="line"><span class="tag">H1 · 900</span><span class="h1">Need to impact</span></div>
    <div class="line"><span class="tag">H2 · 800</span><span class="h2">Logistics that hold</span></div>
    <div class="line"><span class="tag">H3 · 700</span><span class="h3">Operational update</span></div>
  </div>
</body>
</html>
