<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<style>
  body { margin: 0; padding: 24px; background: var(--surface-subtle); font-family: var(--font-body); }
  .panel { background: var(--neutral-000); border: 1px solid var(--border-subtle); border-radius: var(--radius-lg); padding: var(--space-5); }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: var(--space-5); }
</style>
</head>
<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<script type="text/babel">
  const { Input } = window.DesignSystem_cf89c3;
  function Demo() {
    return (
      <div className="panel">
        <div className="grid">
          <Input label="Full name" placeholder="Jane de Vries" />
          <Input label="Donation amount" lead="€" type="number" placeholder="50" hint="One-time donation" />
          <Input label="Email" defaultValue="jane@" error="Enter a valid email address" />
          <Input label="Reference" placeholder="DCA-0421" hint="Optional operational reference" />
        </div>
      </div>
    );
  }
  ReactDOM.createRoot(document.getElementById("root")).render(<Demo />);
</script>
</body>
</html>
