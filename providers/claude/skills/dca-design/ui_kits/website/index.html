<div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>

<script src="../../_ds_bundle.js"></script>
<script type="text/babel" src="parts.jsx"></script>
<script type="text/babel" src="screens.jsx"></script>
<script type="text/babel">
  function App() {
    const [route, setRoute] = React.useState("home");
    const nav = (r) => { setRoute(r); window.scrollTo(0, 0); };
    React.useEffect(() => { if (window.lucide) window.lucide.createIcons(); });
    let screen;
    if (route === "donate") screen = <DonateScreen onNav={nav} />;
    else if (route === "reports") screen = <ReportScreen onNav={nav} />;
    else screen = <HomeScreen onNav={nav} />;
    return (
      <React.Fragment>
        <SiteHeader route={route} onNav={nav} />
        {screen}
        <SiteFooter onNav={nav} />
      </React.Fragment>
    );
  }
  ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
